<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SeaStreet Camera</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000000; color: white; font: 17px system-ui; }
  main { width: min(100%, 640px); padding: 20px; text-align: center; }
  video { width: 100%; max-height: 75vh; background: #000000; border: 2px solid #004A8A; border-radius: 12px; }
  button { margin-top: 18px; padding: 14px 24px; border: 0; border-radius: 5px; background: #004A8A; color: white; font: inherit; font-weight: 700;}
  #status { margin-top: 14px; color: white; }
</style>
<main>
  <video id="preview" autoplay muted playsinline></video>
  <button id="start">Start Camera</button>
  <div id="status">Ready</div>
</main>
<script>
  const preview = document.querySelector("#preview");
  const button = document.querySelector("#start");
  const status = document.querySelector("#status");
  let stream;
  let peer;
  let reconnectTimer;
  let audioContext;

  function playMatchSound() {
    const now = audioContext.currentTime;
    [0, 0.13].forEach((delay, index) => {
      const tone = audioContext.createOscillator();
      const volume = audioContext.createGain();
      const start = now + delay;
      tone.frequency.value = index ? 1050 : 700;
      volume.gain.setValueAtTime(0.001, start);
      volume.gain.exponentialRampToValueAtTime(0.25, start + 0.01);
      volume.gain.exponentialRampToValueAtTime(0.001, start + 0.12);
      tone.connect(volume).connect(audioContext.destination);
      tone.start(start);
      tone.stop(start + 0.13);
    });
    status.textContent = "Candidate match";
  }

  function retry(error) {
    if (error) status.textContent = error.message;
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(() => connect().catch(retry), 2000);
  }

  async function waitForIce(candidate) {
    if (candidate.iceGatheringState === "complete") return;
    await new Promise(resolve => candidate.addEventListener("icegatheringstatechange", () => {
      if (candidate.iceGatheringState === "complete") resolve();
    }));
  }

  async function connect() {
    clearTimeout(reconnectTimer);
    const previous = peer;
    peer = null;
    if (previous) previous.close();
    const candidate = new RTCPeerConnection();
    peer = candidate;
    const sender = candidate.addTrack(stream.getVideoTracks()[0], stream);
    const parameters = sender.getParameters();
    if (parameters.encodings.length) {
      parameters.encodings[0].maxBitrate = 8_000_000;
      parameters.encodings[0].maxFramerate = 30;
      await sender.setParameters(parameters).catch(() => {});
    }
    const alerts = candidate.createDataChannel("alerts");
    alerts.addEventListener("message", event => {
      if (event.data === "match") playMatchSound();
    });
    candidate.addEventListener("connectionstatechange", () => {
      if (candidate !== peer) return;
      status.textContent = candidate.connectionState === "connected" ? "Connected to laptop" : candidate.connectionState;
      if (candidate.connectionState === "connected") clearTimeout(reconnectTimer);
      else if (["failed", "disconnected", "closed"].includes(candidate.connectionState)) retry();
    });
    await candidate.setLocalDescription(await candidate.createOffer());
    await waitForIce(candidate);
    const response = await fetch("/offer", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(candidate.localDescription)
    });
    if (!response.ok) throw new Error(await response.text());
    if (candidate === peer) await candidate.setRemoteDescription(await response.json());
  }

  async function start() {
    button.hidden = true;
    button.disabled = true;
    status.textContent = "Starting camera…";
    try {
      audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
      await audioContext.resume();
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: {ideal: "environment"},
          width: {ideal: 1920},
          height: {ideal: 1080},
          frameRate: {ideal: 30, max: 30}
        }
      });
      stream.getVideoTracks()[0].contentHint = "detail";
      preview.srcObject = stream;
      navigator.wakeLock?.request("screen").catch(() => {});
      await connect();
    } catch (error) {
      status.textContent = error.message;
      button.hidden = false;
      button.disabled = false;
    }
  }

  button.addEventListener("click", start);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && stream && peer?.connectionState !== "connected") connect().catch(retry);
  });
</script>
</html>
